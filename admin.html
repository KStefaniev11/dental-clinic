<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
    <title>Резервации — админ панел</title>
</head>

<body class="admin-body">

    <!-- екран за вход -->
    <div id="loginScreen" class="admin-login" hidden>
        <form class="login-card" id="loginForm">
            <div class="eyebrow">Служебен достъп</div>
            <h1>Резервации</h1>
            <p>Въведи паролата, за да видиш запазените часове.</p>

            <div class="field">
                <label for="password">Парола</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="submit-btn" id="loginBtn">Вход</button>
            <div class="form-msg" id="loginMsg"></div>

            <a class="back-link" href="/">← Към сайта</a>
        </form>
    </div>

    <!-- панел -->
    <div id="panel" hidden>
        <header class="admin-header">
            <div class="admin-brand">
                <strong>Резервации</strong>
                <span>Д-р Веселинка Стефаниева</span>
            </div>
            <div class="admin-actions">
                <a class="btn-ghost-sm" href="/">Към сайта</a>
                <a class="btn-ghost-sm" href="/api/admin/export">Свали CSV</a>
                <button class="btn-ghost-sm" id="logoutBtn" type="button">Изход</button>
            </div>
        </header>

        <main class="admin-main">
            <div class="stat-row" id="statRow"></div>

            <div class="admin-toolbar">
                <div class="field">
                    <label for="fFrom">От дата</label>
                    <input type="date" id="fFrom">
                </div>
                <div class="field">
                    <label for="fTo">До дата</label>
                    <input type="date" id="fTo">
                </div>
                <div class="field">
                    <label for="fStatus">Статус</label>
                    <select id="fStatus">
                        <option value="all">Всички</option>
                        <option value="new">Нови</option>
                        <option value="confirmed">Потвърдени</option>
                        <option value="cancelled">Отказани</option>
                    </select>
                </div>
                <div class="field grow">
                    <label for="fSearch">Търсене</label>
                    <input type="search" id="fSearch" placeholder="Име, телефон, имейл или услуга">
                </div>
                <button class="btn-ghost-sm" id="resetBtn" type="button">Изчисти</button>
            </div>

            <div class="table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Час</th>
                            <th>Пациент</th>
                            <th>Телефон</th>
                            <th>Имейл</th>
                            <th>Услуга</th>
                            <th>Бележка</th>
                            <th>Статус</th>
                            <th class="col-actions">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
                <div class="table-empty" id="tableEmpty" hidden>Няма резервации по този филтър.</div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>

</html>
